<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUVAG Šifrovačky – administrace</title><link rel="stylesheet" href="../style.css"><style>
.admin-shell{max-width:1000px;margin:0 auto;padding:20px}.admin-panel{background:#fff;border-radius:18px;padding:22px;margin:18px 0;border:1px solid #ddd}.admin-shell h1{font-size:28px;line-height:1.2}.admin-shell h2{font-size:21px}.admin-shell button{width:auto;padding:10px 16px}.admin-shell input{max-width:420px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.admin-stats{display:flex;gap:12px;flex-wrap:wrap}.admin-stat{background:#f3f3f3;border-radius:12px;padding:16px;flex:1;min-width:140px}.admin-stat strong{display:block;font-size:25px}.admin-review{border-top:1px solid #ddd;padding:15px 0;overflow-wrap:anywhere}.admin-review small{color:#666}.admin-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px}.admin-photo{border:1px solid #ddd;padding:10px;border-radius:12px;min-width:0}.admin-photo img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#eee}.admin-photo button{width:100%}.admin-photo small{overflow-wrap:anywhere}.admin-photo .approved{color:#247a43;font-weight:700}.admin-photo .pending{color:#aa5b13;font-weight:700}#adminMessage{font-weight:700}button:disabled{opacity:.5}
</style></head><body><main class="admin-shell"><div class="admin-top"><a href="../">← Zpět na šifrovačku</a><button id="logout" hidden>Odhlásit se</button></div><h1>Administrace šifrovačky KUVAG</h1><p id="adminMessage" role="status"></p><section id="loginPanel" class="admin-panel"><h2>Přihlášení správce</h2><form id="loginForm"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Heslo</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">PŘIHLÁSIT SE</button></form></section><div id="dashboard" hidden><div class="admin-stats"><div class="admin-stat"><strong id="countFinished">–</strong>Dokončených her</div><div class="admin-stat"><strong id="countRatings">–</strong>Hodnocení</div><div class="admin-stat"><strong id="averageRating">–</strong>Průměr hvězdiček</div><div class="admin-stat"><strong id="countPhotos">–</strong>Fotografií</div></div><section class="admin-panel"><div class="admin-top"><h2>Hodnocení a podněty</h2><button id="refresh" type="button">Aktualizovat</button></div><div id="ratings"></div></section><section class="admin-panel"><h2>Fotografie ke schválení</h2><p>Fotografie jsou soukromé. Schválení je pouze interní označení, fotografie se tím automaticky nezveřejní.</p><div id="photos" class="admin-photos"></div></section></div></main><script src="../admin.js?v=20261008-admin-1"></script></body></html>
