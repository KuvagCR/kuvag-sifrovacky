<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ef6446">
  <meta name="description" content="KUVAG Šifrovačky – interaktivní šifrovací hry">
  <title>KUVAG Šifrovačky</title>
  <link rel="stylesheet" href="style.css?v=20261113-light-finish">
</head>
<body>
<main class="shell">
  <header>
    <div class="brand">
      <img class="real-kuvag-logo" src="logo%20bez%20pozad%C3%AD.png" alt="KUVAG">
      <span class="game-label">ŠIFROVAČKY</span>
    </div>
    <div class="header-actions"><button id="newGameButton" type="button" hidden style="font-size:12px;padding:8px;border:1px solid #a9855c;border-radius:8px;background:#fff8e9;color:#603923;cursor:pointer">NOVÁ HRA</button><button id="cityMapButton" class="map-button" type="button" hidden aria-label="Otevřít orientační mapu"><svg aria-hidden="true" width="23" height="23" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align:middle;margin-right:5px"><circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="1.2"/><circle cx="16" cy="16" r="10.4" stroke="currentColor" stroke-width=".6"/><path d="M16 2.5 19.2 12.8 29.5 16 19.2 19.2 16 29.5 12.8 19.2 2.5 16 12.8 12.8Z" stroke="currentColor" stroke-width="1.1" fill="none"/><path d="M16 3.5 19.2 12.8 16 16 12.8 12.8Z" fill="currentColor"/><path d="M16 16 19.2 19.2 16 28.5 12.8 19.2Z" fill="currentColor" opacity=".65"/><circle cx="16" cy="16" r="1.4" fill="currentColor"/></svg> MAPA</button><div id="liveScore" class="timer" hidden></div><div id="timer" class="timer">00:00</div></div>
  </header>
  <section id="app" class="card"></section>
</main>
<script>
if(new URLSearchParams(location.search).get("restart")==="1"){
  try{
    for(let i=localStorage.length-1;i>=0;i--){
      const key=localStorage.key(i);
      if(key&&key.startsWith("kuvag-progress-"))localStorage.removeItem(key);
    }
  }catch(e){console.warn("Restart hry:",e)}
  history.replaceState(null,"",location.pathname+"?game=1");
}
</script>
<script src="app.js?v=20261113-zs-access"></script>

</body>
</html>
